name: Browser build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Match rules
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script tests/test_match.gd
      - name: Gameplay regression
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script tests/test_gameplay.gd
      - name: Animated throws
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script tests/test_throw.gd
      - name: Prop physics
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script tests/test_props.gd
      - name: CPU pacing
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script tests/test_bot_pacing.gd
      - name: CPU match completion
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script tests/test_bots.gd
