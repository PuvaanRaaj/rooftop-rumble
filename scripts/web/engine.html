<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath fill=%27%2330465c%27 d=%27M3 10h26v19H3z%27/%3E%3Cpath fill=%27%23f9cf76%27 d=%27M3 6h26v5H3z%27/%3E%3C/svg%3E">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1922;color:#fff;font-family:system-ui,sans-serif}
    #canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
    #status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#0c1922}
    #status[hidden]{display:none}
    progress{width:220px;max-width:80vw;accent-color:#eab759;margin:16px auto}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Rooftop Rumble game">Your browser needs WebGL 2 to play.</canvas>
  <div id="status" role="status"><span id="message">Loading Rooftop Rumble…</span><progress id="progress"></progress></div>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    const notify = (type, details = {}) => {
      if (window.parent !== window) window.parent.postMessage({type, ...details}, window.location.origin);
    };
    const fail = (error) => {
      message.textContent = error instanceof Error ? error.message : String(error);
      progress.hidden = true;
      status.hidden = false;
      notify('rooftop-error', {message: message.textContent});
    };
    try {
      const missing = Engine.getMissingFeatures({threads: false});
      if (missing.length) throw new Error('This browser needs: ' + missing.join(', '));
      const engine = new Engine(config);
      engine.startGame({
        canvas: document.getElementById('canvas'),
        onProgress: (current, total) => {
          if (total > 0) { progress.max = total; progress.value = current; }
          notify('rooftop-progress', {current, total});
        },
        onExit: (code) => { if (code !== 0) fail('The game stopped. Reload to try again.'); },
      }).then(() => {
        status.hidden = true;
        document.getElementById('canvas').focus();
        notify('rooftop-ready');
      }).catch(fail);
    } catch (error) { fail(error); }
  </script>
</body>
</html>
